<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="X-UA-Compatible"
      content="IE=edge"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>MOYO — Header</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>
  <body>
    <header class="header">
      <div class="header__inner">
        <a
          class="logo"
          href="#"
        >
          <img
            class="logo__img"
            src="./images/logo.png"
            alt="MOYO"
          />
        </a>
        <nav
          class="nav"
          aria-label="Main"
        >
          <ul class="nav__list">
            <li class="nav__item">
              <a
                class="nav__link is-active"
                href="#"
              >
                Apple
              </a>
            </li>
            <li class="nav__item">
              <a
                class="nav__link"
                href="#"
              >
                Samsung
              </a>
            </li>
            <li class="nav__item">
              <a
                class="nav__link"
                href="#"
              >
                Smartphones
              </a>
            </li>
            <li class="nav__item">
              <a
                class="nav__link"
                href="#"
                data-qa="hover"
              >
                Laptops & computers
              </a>
            </li>
            <li class="nav__item">
              <a
                class="nav__link"
                href="#"
              >
                Gadgets
              </a>
            </li>
            <li class="nav__item">
              <a
                class="nav__link"
                href="#"
              >
                Tablets
              </a>
            </li>
            <li class="nav__item">
              <a
                class="nav__link"
                href="#"
              >
                Photo
              </a>
            </li>
            <li class="nav__item">
              <a
                class="nav__link"
                href="#"
              >
                Video
              </a>
            </li>
          </ul>
        </nav>
      </div>
    </header>
  </body>
</html>
